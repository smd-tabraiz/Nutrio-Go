services:
  # 1. NutriGo Backend Express & MongoDB API
  - type: web
    name: nutrigo-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://tabraizsmd_db_user:M3EcmHNdVHln8Utf@cluster0.31mtvlo.mongodb.net/nutrigo?retryWrites=true&w=majority&appName=Cluster0
      - key: CORS_ORIGIN
        value: '*'

  # 2. NutriGo Frontend Vite React SPA
  - type: static
    name: nutrigo-frontend
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nutrigo-backend.onrender.com/api
